version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql_lanchonete
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"

    volumes:
      #Banco persistente
      - mysql_data:/var/lib/mysql

      #Script inicial
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    container_name: api_lanchonete
    restart: always

    volumes:
      #Código da aplicação
      - .:/app

    ports:
      - "3000:3000"

    depends_on:
      - db

    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 3306

volumes:
  mysql_data:
