version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: foodhub_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodhub
      MYSQL_USER: foodhub_user
      MYSQL_PASSWORD: foodhub_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: foodhub_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"

  web:
    image: php:8.1-apache
    container_name: foodhub_web
    restart: always
    volumes:
      - ./html:/var/www/html/html
      - ./css:/var/www/html/css
      - ./js:/var/www/html/JS
      - ./backend:/var/www/html/backend
    ports:
      - "8081:80"
    depends_on:
      - db
    command: >
          sh -c "a2enmod rewrite &&
          docker-php-ext-install pdo pdo_mysql &&
          apache2-foreground"

volumes:
  db_data:
