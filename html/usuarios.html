<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Usuários</title>
</head>
<body>
  <h2>Usuários Cadastrados</h2>
  <a href="restrita.html">⬅ Voltar</a> | 
  <a href="cadastrar_usuario.html">➕ Novo Usuário</a>

  <table border="1" cellpadding="10" id="tabelaUsuarios">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function carregarUsuarios() {
      const response = await fetch("../backend/listar_usuarios.php");
      const usuarios = await response.json();
      const tbody = document.querySelector("#tabelaUsuarios tbody");
      tbody.innerHTML = "";

      usuarios.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${u.id}</td>
          <td>${u.nome}</td>
          <td>${u.email}</td>
          <td>
            <a href="editar_usuario.html?id=${u.id}&nome=${encodeURIComponent(u.nome)}&email=${encodeURIComponent(u.email)}">✏ Editar</a> | 
            <a href="../backend/excluir_usuario.php?id=${u.id}" onclick="return confirm('Tem certeza que deseja excluir?')">🗑 Excluir</a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
    carregarUsuarios();
  </script>
</body>
</html>
